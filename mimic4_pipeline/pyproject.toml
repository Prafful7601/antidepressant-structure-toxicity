[project]
name = "mimic4-antidepressant-toxicity"
version = "0.1.0"
description = "Reproducibility pipeline: FAERS-derived antidepressant organ-toxicity signals tested against MIMIC-IV clinical data."
requires-python = ">=3.9"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.4,<2.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
